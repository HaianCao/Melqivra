[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "melqivra"
version = "0.1.0"
description = "Open-source agentic music studio with durable Modal and Colab GPU execution"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Melqivra contributors" }]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
postgres = [
  "psycopg[binary,pool]>=3.2,<4",
]
dev = [
  "coverage[toml]>=7.6,<8",
  "httpx>=0.28,<1",
  "mypy>=1.13,<2",
  "pip-audit>=2.7,<3",
  "pre-commit>=4,<5",
  "psycopg[binary,pool]>=3.2,<4",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.9,<1",
]

[project.scripts]
melqivra = "agent_music.cli:main"
agent-music = "agent_music.cli:main"

[project.urls]
Homepage = "https://github.com/HaianCao/Melqivra"
Repository = "https://github.com/HaianCao/Melqivra.git"
Issues = "https://github.com/HaianCao/Melqivra/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_music", "src/agent_music_worker"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "scripts"]
warn_unreachable = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["modal", "modal.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["agent_music.scheduler", "agent_music.store"]

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = true
exclude_also = [
"if TYPE_CHECKING:",
"raise NotImplementedError",
]

