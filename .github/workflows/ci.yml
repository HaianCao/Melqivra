name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked dependencies
        run: uv sync --locked --extra dev
      - name: Check formatting
        run: uv run --frozen ruff format --check src tests scripts
      - name: Lint
        run: uv run --frozen ruff check src tests scripts
      - name: Type check
        run: uv run --frozen mypy
      - name: Test with critical-path coverage
        run: uv run --frozen coverage run -m unittest discover -s tests -v
      - name: Enforce coverage threshold
        run: uv run --frozen coverage report
      - name: Build package
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: uv build
      - name: Audit Python dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: uv run --frozen pip-audit

