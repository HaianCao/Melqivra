name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked dependencies
        run: uv sync --locked --extra dev
      - name: Check formatting
        run: uv run --frozen ruff format --check src tests scripts
      - name: Lint
        run: uv run --frozen ruff check src tests scripts
      - name: Type check
        run: uv run --frozen mypy
      - name: Test with critical-path coverage
        run: uv run --frozen coverage run -m unittest discover -s tests -v
      - name: Enforce coverage threshold
        run: uv run --frozen coverage report
      - name: Build package
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: uv build
      - name: Audit Python dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: uv run --frozen pip-audit

  postgres-contract:
    name: PostgreSQL/S3 service contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine@sha256:d3244e8ce3f165ee3c93d9c4a4b1d0fe48b3a89e2287b717fdcbbde92d405065
        env:
          POSTGRES_DB: melqivra_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d melqivra_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AWS_ACCESS_KEY_ID: melqivra-ci
      AWS_SECRET_ACCESS_KEY: melqivra-ci-only-password
      MELQIVRA_TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/melqivra_test
      MELQIVRA_TEST_S3_ENDPOINT: http://127.0.0.1:9000
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked dependencies
        run: uv sync --locked --extra dev
      - name: Start pinned non-root MinIO contract service
        run: |
          docker volume create melqivra-s07-minio-data
          docker run --rm --user 0 \
            --volume melqivra-s07-minio-data:/data \
            --entrypoint chown \
            alpine/minio@sha256:cf23643a6cf9ce159c57643ceb88279e431262282428c9e0bf3a7ef1a97e84b4 \
            -R 100:101 /data
          docker run --detach --name melqivra-s07-minio \
            --env MINIO_ROOT_USER=melqivra-ci \
            --env MINIO_ROOT_PASSWORD=melqivra-ci-only-password \
            --publish 127.0.0.1:9000:9000 \
            --volume melqivra-s07-minio-data:/data \
            alpine/minio@sha256:cf23643a6cf9ce159c57643ceb88279e431262282428c9e0bf3a7ef1a97e84b4
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs melqivra-s07-minio
          exit 1
      - name: Run PostgreSQL contract suite
        run: >-
          uv run --frozen coverage run --branch
          --source=agent_music.postgres_migrations,agent_music.postgres_job_store,agent_music.postgres_project_repository,agent_music.postgres_approval_repository,agent_music.postgres_tool_execution_repository,agent_music.postgres_artifact_repository,agent_music.postgres_rate_limit,agent_music.service_backup
          -m unittest tests.test_postgres_job_store tests.test_postgres_project_repository tests.test_postgres_policy_repositories tests.test_postgres_artifact_repository tests.test_postgres_rate_limit tests.test_s3_artifact_integration tests.test_service_backup tests.test_service_backup_integration -v
      - name: Enforce PostgreSQL adapter coverage
        run: uv run --frozen coverage report --fail-under=80
      - name: Remove MinIO contract service
        if: always()
        run: |
          docker rm --force --volumes melqivra-s07-minio || true
          docker volume rm melqivra-s07-minio-data || true

