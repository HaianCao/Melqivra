services:
  harness:
    build:
      context: .
    environment:
      HARNESS_DATABASE_PATH: /data/harness.db
      ARTIFACT_ROOT: /data/artifacts
      GPU_RUNNER: ${GPU_RUNNER:-fake}
      GPU_MAX_CONCURRENCY: "1"
      GPU_IDLE_TIMEOUT_SECONDS: ${GPU_IDLE_TIMEOUT_SECONDS:-300}
      COLAB_SESSION_NAME: ${COLAB_SESSION_NAME:-melqivra-t4}
      COLAB_GPU: ${COLAB_GPU:-T4}
      COLAB_AUTH_PROVIDER: ${COLAB_AUTH_PROVIDER:-oauth2}
      COLAB_CLI_CONFIG: /data/colab/sessions.json
    ports:
      - "8000:8000"
    volumes:
      - harness-data:/data
    restart: unless-stopped

volumes:
  harness-data:

